[advisories]
ignore = [
  # Unmaintained, no maintained replacement upstream: pulled by futures-util
  # (axum, tonic) and by serde_yaml_ng (tonic-rest-openapi).
  { id = "RUSTSEC-2026-0441", reason = "pin-utils: transitive via futures-util, no safe upgrade" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: transitive via serde_yaml_ng, no safe upgrade" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "CC0-1.0", "Unicode-3.0", "Unicode-DFS-2016", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
